<script>Math.random=(()=>{let s=20261006;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();</script>

<script>
// 第1話 オープニング後〜第1章「氷河期の世界」。時刻 t は冷やし（sample_30s）の直後を 0 とする
const MAIN=ctx;
const CREAM='244,232,210',OCHRE='226,170,120',DARK='rgb(38,26,18)';
let TL,MAP;const LINE={};
const at=(id,f=0)=>{const l=LINE[id];return l.t0+(l.t1-l.t0-0.3)*f};
const atStr=(id,s)=>{const l=LINE[id];const i=l.text.indexOf(s);if(i<0)throw new Error('no '+s+' in '+id);return at(id,i/l.text.length)};
const SC=n=>TL.scenes.find(s=>s.name===n);
const fadeIn=(t,t0,d=0.6)=>ease((t-t0)/d);
const win=(t,t0,t1,d=0.5)=>ease((t-t0)/d)*(1-ease((t-t1)/d));
function txt(s,x,y,size,o={}){ctx.save();ctx.font=`${o.weight||500} ${size}px Mincho`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
 ctx.globalAlpha=(o.alpha??1);ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=o.blur??14;ctx.fillStyle=`rgb(${o.color||CREAM})`;
 if(o.ls){ctx.letterSpacing=o.ls+'px'}ctx.fillText(s,x,y);ctx.restore()}
function note(s,a=1){txt(s,W-48,52,24,{align:'right',alpha:0.6*a,color:'232,220,198',blur:8})}
function camMove(t,keys){// keys: [[time,cx,cy,z,dur]]  dur秒かけて移動
 let c=keys[0].slice(1,4);for(let i=1;i<keys.length;i++){const[k0,x,y,z,d=1.6]=keys[i];if(t<k0)break;const k=ease((t-k0)/d);c=[lerp(c[0],x,k),lerp(c[1],y,k),lerp(c[2],z,k)]}return c}
function torchLight(sx,sy,R,I,warm=1){
 const lg=ctx.createRadialGradient(sx,sy,0,sx,sy,R*1.25);
 lg.addColorStop(0,`rgb(${Math.min(255,255*I)},${Math.min(255,222*I)},${Math.min(255,170*I)})`);
 lg.addColorStop(0.35,`rgb(${Math.min(255,235*I)},${Math.min(255,170*I)},${Math.min(255,105*I)})`);
 lg.addColorStop(0.7,`rgb(${120*I},${60*I},${24*I})`);lg.addColorStop(1,'rgb(0,0,0)');
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='multiply';ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(sx,sy,0,sx,sy,R*0.9);gl.addColorStop(0,`rgba(255,150,60,${0.08*I*warm})`);gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.restore()}
function darkBg(c='#120c09'){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=c;ctx.fillRect(0,0,W,H);
 const g=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,1100);g.addColorStop(0,'rgba(70,45,28,0.55)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function label(s,x,y,a,o={}){if(a<=0)return;txt(s,x,y,o.size||34,{alpha:a,color:o.color||CREAM,align:o.align,weight:o.weight})}
function leader(x0,y0,x1,y1,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a*0.8;ctx.strokeStyle=`rgb(${CREAM})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(lerp(x0,x1,a),lerp(y0,y1,a));ctx.stroke();ctx.restore()}

// ================= 1. intro / 15. outro: 冷やしの洞窟 =================
function caveWorld(t,cx,cy,z,R,I){ctx.setTransform(z,0,0,z,W/2-cx*z,H/2-cy*z);ctx.drawImage(world,0,0);
 ctx.globalCompositeOperation='multiply';ctx.drawImage(legsA,bisonO.x,bisonO.y);ctx.globalCompositeOperation='source-over';
 const tx=W/2+Math.sin(t*0.9)*60+n1(t*0.5,1)*50-25,ty=H/2+Math.cos(t*0.7)*30+30;torchLight(tx,ty,R*z,I);ctx.setTransform(1,0,0,1,0,0)}
function sIntro(t){const s=SC('intro');const k=ease((t-s.t0+1)/14);
 caveWorld(t,lerp(620,1900,k),lerp(560,470,k),lerp(1.15,0.95,k),620,flick(t,0.05));
 const a=win(t,at('n01',0.25),SC('timeline').t0-0.2);label('ショーヴェ洞窟　フランス南部',96,96,a,{align:'left',size:36});label('約3万6000年前',96,146,a,{align:'left',size:28,color:OCHRE});note('※ 図版はイメージ再現')}
function sOutro(t){const s=SC('outro');const k=ease((t-s.t0)/24);
 const dim=1-ease((t-at('n33',0.3))/5);
 caveWorld(t,lerp(2500,2880,k),lerp(640,690,k),lerp(1.0,1.3,k),lerp(300,560,ease((t-s.t0)/3))*dim+1,flick(t,0.06));
 const q=at('n32',0);txt('何のために？',W/2,470,110,{weight:800,alpha:win(t,q,at('n33',0.2),0.8),ls:10});
 const e=at('n33',0.75);txt('次章',W/2,440,32,{color:OCHRE,alpha:win(t,e,s.t1-1.0,0.8)});txt('発見の物語',W/2,520,72,{weight:800,alpha:win(t,e+0.3,s.t1-1.0,0.8),ls:8});
 note('※ 図版はイメージ再現',1-ease((t-at('n33',0.5))/1))}

// ================= 2. timeline =================
function sTimeline(t){darkBg();const s=SC('timeline');const x0=170,x1=1750,y=560;const X=ya=>x0+(36000-ya)/36000*(x1-x0);
 const p=easeOut((t-s.t0-0.2)/1.6);
 ctx.strokeStyle=`rgba(${CREAM},0.85)`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(lerp(x0,x1,p),y);ctx.stroke();
 for(let ya=35000;ya>=0;ya-=5000){const x=X(ya);if(x>lerp(x0,x1,p))break;ctx.fillStyle=`rgba(${CREAM},0.5)`;ctx.fillRect(x-1,y-10,2,20);
  if(ya>0&&ya<35000)txt(`${ya/10000>=1?(ya/10000)+'万':ya}年前`.replace('5000年前','5000年前'),x,y+44,22,{alpha:0.5})}
 txt('いま',x1,y+44,26,{alpha:p});
 // ショーヴェ
 const a1=fadeIn(t,s.t0+0.4);ctx.fillStyle=`rgba(${OCHRE},${a1})`;ctx.beginPath();ctx.arc(x0,y,12,0,7);ctx.fill();
 txt('約3万6000年前',x0,y-120,34,{align:'left',alpha:a1,color:OCHRE});txt('洞窟の絵',x0,y-70,44,{align:'left',alpha:a1,weight:800});
 // 文字
 const tw=atStr('n02','文字');const a2=fadeIn(t,tw-0.1);const xw=X(5200);
 ctx.fillStyle=`rgba(${OCHRE},${0.25*a2})`;ctx.fillRect(xw,y-26,(x1-xw)*easeOut((t-tw)/0.8),52);
 ctx.fillStyle=`rgba(${CREAM},${a2})`;ctx.beginPath();ctx.arc(xw,y,10,0,7);ctx.fill();
 txt('約5000年前',xw,y-120,30,{alpha:a2,color:OCHRE});txt('文字の誕生',xw,y-72,40,{alpha:a2,weight:800});
 // 3万年以上
 const tb=atStr('n02','3万年以上');const a3=easeOut((t-tb)/1.0);if(a3>0){ctx.strokeStyle=`rgba(${OCHRE},0.9)`;ctx.lineWidth=3;const yb=y+100;
  ctx.beginPath();ctx.moveTo(x0,yb-14);ctx.lineTo(x0,yb);ctx.lineTo(lerp(x0,xw,a3),yb);if(a3>0.98){ctx.lineTo(xw,yb-14)}ctx.stroke();
  txt('3万年以上',(x0+xw)/2,yb+50,48,{weight:800,alpha:fadeIn(t,tb+0.5),color:OCHRE})}}

// ================= 3. series =================
const EPS=['最初の一筆','エジプト・メソポタミア','ギリシャ','ヘレニズム・ローマ','初期キリスト教・ビザンティン','ロマネスク・ゴシック','初期ルネサンス','盛期ルネサンス','ヴェネツィア派・マニエリスム','北方ルネサンス','バロック','オランダ黄金時代','ベラスケスからゴヤ','ロココ・新古典主義','ロマン主義','写実主義と写真','印象派','ポスト印象派','世紀末','フォーヴィスム・表現主義','抽象の誕生','キュビスム・シュルレアリスム','戦争と美術'];
function sSeries(t){darkBg();const s=SC('series');
 txt('西洋美術史　全23話',W/2,130,46,{weight:800,alpha:fadeIn(t,s.t0+0.2),ls:6});
 const r0=at('n03',0.08),r1=at('n03',0.85);const dimT=at('n04',0);const dim=ease((t-dimT)/0.8);
 const cw=272,ch=124,gx=20,gy=22,cols=6,ox=(W-(cols*cw+(cols-1)*gx))/2,oy=210;
 EPS.forEach((e,i)=>{const ti=lerp(r0,r1,i/22);const a=easeOut((t-ti)/0.5);if(a<=0)return;const x=ox+(i%cols)*(cw+gx),y=oy+Math.floor(i/cols)*(ch+gy)+(1-a)*16;
  const al=a*(i===0?1:1-dim*0.75);ctx.globalAlpha=al;ctx.fillStyle=i===0?'rgba(120,70,36,0.55)':'rgba(255,240,215,0.06)';ctx.fillRect(x,y,cw,ch);
  ctx.strokeStyle=i===0?`rgba(${OCHRE},0.95)`:`rgba(${CREAM},0.25)`;ctx.lineWidth=i===0?3:1.5;ctx.strokeRect(x,y,cw,ch);ctx.globalAlpha=1;
  txt(`第${i+1}話`,x+18,y+30,22,{align:'left',alpha:al,color:OCHRE,blur:0});
  const fs=Math.min(30,Math.floor(236/e.length));txt(e,x+18,y+80,fs,{align:'left',alpha:al,blur:0,weight:i===0?800:500})});
 const q=fadeIn(t,atStr('n04','ひとつ'),0.8);if(q>0){ctx.fillStyle=`rgba(10,6,4,${0.55*q})`;ctx.fillRect(0,780,W,150);txt('毎回ひとつの「問い」から',W/2,855,56,{weight:800,alpha:q,ls:4})}}

// ================= 4. four =================
function sFour(t){darkBg();const s=SC('four');
 txt('作品を読む　4つの手がかり',W/2,140,44,{weight:800,alpha:fadeIn(t,s.t0+0.2),ls:4});
 const items=[['誰が','お金を出したのか','誰が'],['何のために','描かれたのか','何のため'],['どんな','道具と技術で','どんな道具'],['その時代に','何が起きていたか','そして']];
 items.forEach(([a,b,k],i)=>{const ti=atStr('n05',k)-0.15;const p=easeOut((t-ti)/0.7);if(p<=0)return;const x=i%2?1380:540,y=i<2?380:690;
  ctx.globalAlpha=p;ctx.strokeStyle=`rgba(${OCHRE},0.7)`;ctx.lineWidth=2;ctx.strokeRect(x-330,y-120,660,240);ctx.globalAlpha=1;
  txt(['一','二','三','四'][i],x-280,y-78,30,{color:OCHRE,alpha:p,blur:0});
  txt(a,x,y-36+(1-p)*16,70,{weight:800,alpha:p,ls:4});txt(b,x,y+50+(1-p)*16,40,{alpha:p})})}

// ================= 5. question =================
let stencilCv,qRock;
function sQuestion(t){const s=SC('question');ctx.setTransform(1,0,0,1,0,0);const z=1+0.06*ease((t-s.t0)/30);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);ctx.drawImage(qRock,0,0);ctx.globalCompositeOperation='multiply';ctx.drawImage(stencilCv,480-450,540-450);ctx.restore();
 torchLight(560+Math.sin(t*0.8)*30,560,820,flick(t,0.04),0.6);
 ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(0,0,W,H);
 const a0=win(t,at('n06',0),s.t1-0.6,0.6);txt('第1話の問い',930,330,38,{align:'left',color:OCHRE,alpha:a0});
 if(a0>0){ctx.fillStyle=`rgba(${OCHRE},${a0*0.8})`;ctx.fillRect(930,370,lerp(0,560,easeOut((t-at('n06',0))/1.2)),2)}
 telop('人は、なぜ',930,480,86,t,at('n07',0),s.t1-0.6,{weight:800,align:'left',per:0.09});
 telop('絵を描きはじめたのか',930,615,86,t,atStr('n07','絵'),s.t1-0.6,{weight:800,align:'left',per:0.09});
 note('※ 図版はイメージ再現')}

// ================= 6. chapter =================
function sChapter(t){const s=SC('chapter');ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const l=t-s.t0;const out=1-ease((l-(s.t1-s.t0-0.9))/0.8);
 txt('第1章',W/2,410,46,{color:OCHRE,alpha:fadeIn(l,0.4,0.8)*out,ls:10});
 telop('氷河期の世界',W/2,540,124,t,s.t0+0.8,s.t1-0.9,{weight:800,per:0.12,ls:0.14});
 const lw=easeOut((l-1.4)/1.2)*620;ctx.globalAlpha=out;ctx.fillStyle=`rgba(${OCHRE},0.9)`;ctx.fillRect(W/2-lw/2,640,lw,2);ctx.globalAlpha=1}

// ================= 7. panel: ショーヴェの動物たち =================
let panel;const PW=2900;
const PANEL=[['lion',470,720,1.6,{flip:true,seed:11}],['lion',800,640,1.45,{flip:true,seed:12}],['rhino',1420,730,1.55,{flip:true,seed:21}],['mammoth',2040,770,1.4,{flip:true,seed:31}],['bear',2620,730,1.55,{flip:true,seed:41}]];
function buildPanel(){panel=mk(PW,1080);const g=panel.getContext('2d');g.drawImage(rockOnly,500,60,PW,1080,0,0,PW,1080);
 for(const[n,x,y,s,o]of PANEL){const L=paintLayer(900,640,q=>drawAnimal(q,n,450,560,s,{...o,mode:'cave',fill:'rgba(140,70,30,0.25)',line:6}));g.globalCompositeOperation='multiply';g.drawImage(L,x-450,y-560);g.globalCompositeOperation='source-over'}}
function sPanel(t){const s=SC('panel');
 const c=camMove(t,[[0,640,560,1.05],[atStr('n10','サイ')-0.3,1400,560,1.0,1.4],[atStr('n10','マンモス')-0.3,2000,540,1.0,1.4],[atStr('n10','クマ')-0.3,2500,560,1.0,1.4],[at('n11',0.05),1500,560,0.66,2.4]]);
 ctx.setTransform(c[2],0,0,c[2],W/2-c[0]*c[2],H/2-c[1]*c[2]);ctx.drawImage(panel,0,0);
 const dim=1-0.85*ease((t-at('n12',0.3))/3);
 torchLight(W/2+Math.sin(t*0.8)*40,H/2+20,lerp(700,1250,ease((t-at('n11',0.05))/2.4))*dim+1,flick(t,0.05)*lerp(1,0.6,1-dim));
 const P=(x,y)=>[(x-c[0])*c[2]+W/2,(y-c[1])*c[2]+H/2];
 const labs=[['ホラアナライオン',640,'ライオン'],['ケサイ（毛の長いサイ）',1420,'サイ'],['マンモス',2040,'マンモス'],['ホラアナグマ',2620,'クマ']];
 ctx.setTransform(1,0,0,1,0,0);
 for(const[nm,x,k]of labs){const a=win(t,atStr('n10',k)+0.1,at('n12',0.4),0.5);const[px,py]=P(x,800);label(nm,px,py+24,a,{size:32,weight:800})}
 const b=win(t,at('n11',0.2),at('n12',0.3),0.6);if(b>0){ctx.fillStyle=`rgba(10,6,4,${0.5*b})`;ctx.fillRect(0,110,W,110);txt('いまのフランスにはいない動物たち',W/2,165,46,{weight:800,alpha:b})}
 note('※ 図版はイメージ再現')}

// ================= 8. map =================
let landP,deepP,iceP,alpsP,pyrP,mapTex,refugeOK=0;
function buildMap(){const toP=polys=>{const p=new Path2D();for(const poly of polys)for(const ring of poly){ring.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath()}return p};
 landP=toP(MAP.land);deepP=toP(MAP.deep);iceP=smoothPath(MAP.ice,true,0.4);alpsP=smoothPath(MAP.alps,true,0.5);pyrP=smoothPath(MAP.pyr,true,0.5);
 mapTex=mk(1024,1024);const g=mapTex.getContext('2d');const id=g.createImageData(1024,1024);for(let y=0;y<1024;y++)for(let x=0;x<1024;x++){const v=fbm(n1,x/40,y/40,5);const i=(y*1024+x)*4;id.data[i]=id.data[i+1]=id.data[i+2]=128+(v-0.5)*160;id.data[i+3]=255}g.putImageData(id,0,0)}
const SEA='#141d22',LAND='#6e5236',SHELF='#5d5338';
function drawMap(st){const[cx,cy,z]=st.cam;ctx.setTransform(z,0,0,z,W/2-cx*z,H/2-cy*z);
 ctx.fillStyle=SEA;ctx.fillRect(-600,-400,3200,2000);
 if(st.lgm>0){ctx.save();ctx.globalAlpha=st.lgm;const p=new Path2D();p.rect(-600,-400,3200,2000);p.addPath(deepP);ctx.fillStyle=SHELF;ctx.fill(p,'evenodd');ctx.restore()}
 ctx.fillStyle=LAND;ctx.fill(landP,'evenodd');
 ctx.save();ctx.clip(landP,'evenodd');ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.35;ctx.drawImage(mapTex,-600,-400,3200,2000);ctx.restore();
 ctx.strokeStyle='rgba(235,205,150,0.55)';ctx.lineWidth=1.4/z;ctx.stroke(landP);
 if(st.lgm>0){ctx.save();ctx.globalAlpha=st.lgm*0.9;ctx.strokeStyle='rgba(200,225,235,0.8)';ctx.setLineDash([6/z,5/z]);ctx.lineWidth=1.6/z;ctx.stroke(deepP);ctx.restore()}
 const ice=(path,prog,ox,oy,r)=>{if(prog<=0)return;ctx.save();ctx.beginPath();ctx.arc(ox,oy,r*easeOut(prog),0,7);ctx.clip();
  ctx.shadowColor='rgba(220,240,255,0.6)';ctx.shadowBlur=24;ctx.fillStyle='rgba(232,240,244,0.94)';ctx.fill(path);ctx.shadowBlur=0;
  ctx.clip(path);ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.25;ctx.drawImage(mapTex,-600,-400,3200,2000);ctx.restore()};
 const sc=MAP.sites.scand;ice(iceP,st.ice,sc[0],sc[1],1500);ice(alpsP,st.alps,MAP.sites.alps[0],MAP.sites.alps[1],260);
 if(st.dim>0){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=`rgba(0,0,0,${0.55*st.dim})`;ctx.fillRect(0,0,W,H);ctx.restore()}
 if(st.refuge>0){const[rx,ry]=MAP.sites.refuge;const r=ctx.createRadialGradient(rx,ry,0,rx,ry,150);r.addColorStop(0,`rgba(255,190,110,${0.55*st.refuge})`);r.addColorStop(1,'rgba(255,170,90,0)');
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=r;ctx.beginPath();ctx.ellipse(rx,ry,170,95,-0.15,0,7);ctx.fill();ctx.restore()}
 ctx.setTransform(1,0,0,1,0,0)}
const mapPt=([x,y],c)=>[(x-c[0])*c[2]+W/2,(y-c[1])*c[2]+H/2];
function sMap(t){const s=SC('map');
 const tz=atStr('n17','とくに');
 const cam=camMove(t,[[0,960,540,1],[tz,MAP.sites.refuge[0]+60,MAP.sites.refuge[1]-20,1.75,2.6]]);
 const st={cam,lgm:ease((t-at('n16',0.15))/2.5),ice:(t-at('n14',0))/3.2,alps:(t-at('n15',0))/1.6,dim:ease((t-at('n17',0.1))/1.2),refuge:ease((t-at('n17',0.15))/1.5)};
 drawMap(st);
 // 見出し
 const h=fadeIn(t,at('n13',0.2),0.8);ctx.fillStyle=`rgba(10,6,4,${0.6*h})`;ctx.fillRect(60,64,560,140);
 txt('約2万年前',96,112,52,{align:'left',weight:800,alpha:h});txt('最終氷期の、もっとも寒い時期',96,170,28,{align:'left',color:OCHRE,alpha:h});
 const lab=(key,s1,tA,tB,dx=0,dy=0,size=32)=>{const[x,y]=mapPt(MAP.sites[key],cam);label(s1,x+dx,y+dy,win(t,tA,tB,0.6),{size})};
 lab('scand','氷床　厚さ最大 約3000m',at('n14',0.5),at('n17',0.1),40,40,36);
 lab('alps','アルプスの氷河',at('n15',0.3),at('n17',0.1),40,-60);
 const sl=win(t,at('n16',0.3),at('n17',0.1),0.6);if(sl>0){ctx.fillStyle=`rgba(10,6,4,${0.6*sl})`;ctx.fillRect(60,230,560,84);txt('海面　いまより 約120m 低い',96,272,32,{align:'left',alpha:sl,color:'200,225,235'})}

function buildSubs(){for(const l of TL.lines){const sents=l.text.match(/[^。]+。?/g);const chunks=[];
  for(let s of sents){s=s.replace(/。$/,'');if(s.length<=26){chunks.push(s);continue}
   const parts=s.split(/(?<=、)/);let best=null;for(let i=1;i<parts.length;i++){const a=parts.slice(0,i).join(''),b=parts.slice(i).join('');const sc=Math.max(a.length,b.length);if(!best||sc<best[0])best=[sc,a.replace(/、$/,''),b]}
   if(best&&best[0]<=34){chunks.push(best[1],best[2])}else{const n=Math.ceil(s.length/26);let rest=parts;let cur='';for(const p of parts){if((cur+p).length>s.length/n+4&&cur){chunks.push(cur.replace(/、$/,''));cur=''}cur+=p}if(cur)chunks.push(cur)}}
  const total=chunks.reduce((a,c)=>a+c.length,0);let acc=0;const dur=l.t1-l.t0-0.25;
  chunks.forEach((c,i)=>{const a=l.t0+dur*acc/total;acc+=c.length;const b=i===chunks.length-1?l.t1+0.15:l.t0+dur*acc/total;SUBS.push({t0:a,t1:b,text:c})})}}
function subtitle(t){const s=SUBS.find(s=>t>=s.t0&&t<s.t1);if(!s)return;ctx.setTransform(1,0,0,1,0,0);ctx.save();ctx.font='500 46px Mincho';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineWidth=8;ctx.strokeText(s.text,W/2,1000);ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=12;ctx.fillStyle='#fbf3e4';ctx.fillText(s.text,W/2,1000);ctx.restore()}

// ================= 合成 =================
const SCENES={intro:sIntro,timeline:sTimeline,series:sSeries,four:sFour,question:sQuestion,chapter:sChapter,panel:sPanel,map:sMap,steppe:sSteppe,arrival:sArrival,hunter:sHunter,tools:sTools,section:sSection,reindeer:sReindeer,outro:sOutro};
const bufA=mk(W,H),bufB=mk(W,H);const XF=0.9;
function drawScene(name,t,buf){const g=buf.getContext('2d');ctx=g;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,W,H);SCENES[name](t);g.setTransform(1,0,0,1,0,0);ctx=MAIN}
function render(t){let i=0;while(i<TL.scenes.length-1&&t>=TL.scenes[i+1].t0)i++;
 const cur=TL.scenes[i];drawScene(cur.name,t,bufA);
 MAIN.setTransform(1,0,0,1,0,0);MAIN.globalAlpha=1;MAIN.globalCompositeOperation='source-over';MAIN.drawImage(bufA,0,0);
 if(i>0&&t-cur.t0<XF){drawScene(TL.scenes[i-1].name,t,bufB);MAIN.globalAlpha=1-ease((t-cur.t0)/XF);MAIN.drawImage(bufB,0,0);MAIN.globalAlpha=1}
 ctx=MAIN;
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.08;ctx.drawImage(grains[Math.floor(t*24)%grains.length],0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.0);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 const ch=SC('chapter');if(!(t>=ch.t0&&t<ch.t1))subtitle(t);
 const fi=1-clamp(t/1.0),fo=clamp((t-(TL.duration-1.6))/1.5);const f=Math.max(fi,fo);if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H)}}

 TL=await (await fetch('timeline.json')).json();MAP=await (await fetch('map.json')).json();for(const l of TL.lines)LINE[l.id]=l;window.DURATION=TL.duration;
 buildGrains();buildMottle();buildBison();buildWorld();
 qRock=mk(W,H);qRock.getContext('2d').drawImage(rockOnly,300,0,2133,1200,0,0,W,H);stencilCv=mk(900,900);stencil(stencilCv.getContext('2d'),450,450,1.3,-0.12,1);
 buildPanel();buildMap();buildSteppe();buildSection();buildReindeer();buildSubs();window.SUBS=SUBS;return true})();
