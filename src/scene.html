<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mincho;src:url(fonts/ShipporiMinchoB1-Medium.ttf);font-weight:500}
@font-face{font-family:Mincho;src:url(fonts/ShipporiMinchoB1-ExtraBold.ttf);font-weight:800}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="cave.js"></script>
<script>
// ---------- timing helpers ----------
const FL_START=16.0,FL_END=21.0;
const toggles=(()=>{const a=[];let t=FL_START,iv=0.32;while(t<FL_END-0.05){a.push(t);t+=iv;iv=Math.max(0.105,iv*0.86)}return a})();
window.TOGGLES=toggles;
function legPhase(t){let k=0;for(const x of toggles){if(t>=x)k++;else break}return k}

// camera keyframes [t, cx, cy, zoom]
const CAM=[[0,560,560,1.0],[4.6,560,560,1.0],[7.0,900,560,1.0],[9.4,1820,470,0.92],[11.0,2440,600,1.0],[12.6,2880,690,1.25],[16,2880,690,1.25],[21,2880,690,1.32]];
function cam(t){for(let i=0;i<CAM.length-1;i++){const a=CAM[i],b=CAM[i+1];if(t<=b[0]){const k=ease((t-a[0])/(b[0]-a[0]));return[lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)]}}const l=CAM[CAM.length-1];return[l[1],l[2],l[3]]}

// ---------- render ----------
function render(t){
 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 if(t<21.6) caveScene(t); else titleScene(t);
 // grain + vignette
 ctx.setTransform(1,0,0,1,0,0);
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.10;ctx.drawImage(grains[Math.floor(t*24)%grains.length],0,0,W,H);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 // global fade
 const fo=t>29?clamp((t-29)/0.9):0; if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H)}
}

function caveScene(t){
 const[cx,cy,z]=cam(t);
 // torch
 let R=0,I=1;
 if(t>=4.0){R=lerp(0,430,easeOut((t-4.0)/0.9))}
 const inFl=t>=FL_START&&t<FL_END;
 const ph=legPhase(t);
 let fAmt=inFl?0.12:0.05;
 I=flick(t,fAmt);
 if(inFl){I*= (ph%2?0.86:1.06)}
 if(t>20.7){const k=ease((t-20.7)/0.7);R=lerp(R,2600,k);I*=1+k*1.6}
 // torch world pos wobble
 const tx=cx+Math.sin(t*0.9)*70+n1(t*0.5,1)*60-30, ty=cy+Math.cos(t*0.7)*40+40;
 if(R<=0.5){drawIntro(t);return}
 ctx.setTransform(z,0,0,z,W/2-cx*z,H/2-cy*z);
 ctx.drawImage(world,0,0);
 // bison legs
 const S=bisonO.s;
 let aA=1,aB=1;
 if(inFl){aA=ph%2===0?1:0.07;aB=ph%2===0?0.07:1;if(ph===0){aA=1;aB=1}}
 const bob=inFl?(ph%2?-3:2):0;
 ctx.globalCompositeOperation='multiply';
 ctx.globalAlpha=aA;ctx.drawImage(legsA,bisonO.x,bisonO.y+bob);
 ctx.globalAlpha=aB;ctx.drawImage(legsB,bisonO.x,bisonO.y+bob);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 // light
 const sx=(tx-cx)*z+W/2,sy=(ty-cy)*z+H/2;
 ctx.setTransform(1,0,0,1,0,0);
 const Rr=R*z*(0.97+0.03*I);
 const lg=ctx.createRadialGradient(sx,sy,0,sx,sy,Rr*1.25);
 const c0=Math.min(255,255*I);
 lg.addColorStop(0,`rgb(${c0},${Math.min(255,222*I)},${Math.min(255,170*I)})`);
 lg.addColorStop(0.35,`rgb(${Math.min(255,235*I)},${Math.min(255,170*I)},${Math.min(255,105*I)})`);
 lg.addColorStop(0.7,`rgb(${120*I},${60*I},${24*I})`);
 lg.addColorStop(1,'rgb(0,0,0)');
 ctx.globalCompositeOperation='multiply';ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(sx,sy,0,sx,sy,Rr*0.9);gl.addColorStop(0,`rgba(255,150,60,${0.10*I})`);gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='source-over';
 // ignition flash
 if(t>4.0&&t<4.7){const k=1-clamp((t-4.0)/0.7);ctx.fillStyle=`rgba(255,190,120,${0.35*k})`;ctx.fillRect(0,0,W,H)}
 // leg counter
 if(t>=13.3&&t<16.6){const tips=[...legTips(LEGS_A).slice(0,2),...legTips(LEGS_B).slice(0,2),...legTips(LEGS_A).slice(2),...legTips(LEGS_B).slice(2)];
  const order=[2,0,1,3,4,6,5,7];
  const fade=t>16.0?1-clamp((t-16.0)/0.5):1;
  order.forEach((idx,i)=>{const t0=13.5+i*0.24;if(t<t0)return;const k=easeOut((t-t0)/0.3);const[wx,wy]=tips[idx];
   const px=(wx-cx)*z+W/2,py=(wy-cy)*z+H/2+6;
   ctx.globalAlpha=fade;ctx.strokeStyle='rgba(255,236,200,0.95)';ctx.lineWidth=3;ctx.fillStyle='rgba(20,10,6,0.55)';ctx.beginPath();ctx.arc(px,py,24*k+2,0,7);ctx.fill();ctx.stroke();
   ctx.fillStyle='rgba(255,240,215,1)';ctx.font='800 26px Mincho';ctx.globalAlpha=fade*k;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=10;ctx.fillText(String(i+1),px,py+2);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='start'})}
 // white flare
 if(t>21.0){const k=ease((t-21.0)/0.35);const k2=t>21.35?1-clamp((t-21.35)/0.25):1;ctx.fillStyle=`rgba(255,235,205,${k*k2})`;ctx.fillRect(0,0,W,H);if(t>21.35){ctx.fillStyle=`rgba(0,0,0,${clamp((t-21.35)/0.25)})`;ctx.fillRect(0,0,W,H)}}
 // captions
 telop('人類は、洞窟の暗闇の奥に　絵を描いた。',W/2,940,54,t,5.4,10.0);
 telop('フランス・ショーヴェ洞窟の　バイソン',W/2,940,50,t,11.0,12.6);
 telop('……脚が、8本ある。',W/2,940,64,t,13.3,15.5,{weight:800,per:0.08});
 telop('炎が　ゆらぐと ──',W/2,940,58,t,16.2,17.6);
 telop('動きだす。',W/2,920,96,t,18.3,20.7,{weight:800,per:0.12});
 telop('※ 一説には、人類最古の「アニメーション」',W/2,1012,30,t,19.0,20.7);
 if(t>11&&t<21){ctx.globalAlpha=0.6*clamp((t-11)/0.5)*(t>20.5?1-clamp((t-20.5)/0.4):1);ctx.font='500 24px Mincho';ctx.fillStyle='#e8dcc6';ctx.textAlign='right';ctx.fillText('※ 図版はイメージ再現',W-48,52);ctx.textAlign='start';ctx.globalAlpha=1}
}

function drawIntro(t){
 ctx.setTransform(1,0,0,1,0,0);
 telop('3万6000年前。',W/2,470,92,t,0.9,3.7,{weight:800,per:0.1});
 telop('明かりは、炎しかなかった。',W/2,600,46,t,2.0,3.7);
 // spark before ignition
 if(t>3.75&&t<4.0){const k=(t-3.75)/0.25;const gl=ctx.createRadialGradient(W/2-400,H/2+40,0,W/2-400,H/2+40,60*k);gl.addColorStop(0,'rgba(255,200,120,1)');gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H)}
}

// title rock (dim)
let titleRock;
function titleScene(t){
 if(!titleRock){titleRock=mk(W,H);const g=titleRock.getContext('2d');g.drawImage(rockOnly,600,0,2133,1200,0,0,W,H)}
 const lt=t-21.6;
 const shift=lerp(0,-520,ease((t-24.2)/1.4));
 ctx.drawImage(titleRock,0,0);
 // soft light
 ctx.globalCompositeOperation='multiply';const lg=ctx.createRadialGradient(W/2+shift*0.6,H/2,0,W/2+shift*0.6,H/2,1100);
 const I=flick(t,0.035);lg.addColorStop(0,`rgb(${235*I},${190*I},${140*I})`);lg.addColorStop(0.6,'rgb(90,50,25)');lg.addColorStop(1,'rgb(10,5,3)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
 // fade in from black
 if(lt<0.6){/* drawn after */}
 // stencil spray
 const prog=clamp((t-22.0)/2.0);
 const sc=document.createElement('canvas');
 const hx=W/2+shift,hy=H/2+40;
 ctx.globalCompositeOperation='multiply';stencil(ctx,hx,hy,1.25,-0.12,easeOut(prog)*1.0);ctx.globalCompositeOperation='source-over';
 // the real hand (lifting away)
 const lift=clamp((t-24.0)/0.8);
 if(t<24.8){ctx.save();ctx.globalAlpha=1-lift;ctx.fillStyle='rgb(58,34,22)';ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=40+lift*60;ctx.shadowOffsetY=20+lift*40;
  const sc2=1+lift*0.12;fillHand(ctx,hx,hy-lift*20,1.25*sc2,-0.12);ctx.restore()}
 // spray mist
 if(t>22.0&&t<24.1){const r=rng(Math.floor(t*30));ctx.fillStyle='rgba(200,80,40,0.25)';for(let i=0;i<120;i++){const a=r()*7,d=150+r()*260;ctx.beginPath();ctx.arc(hx+Math.cos(a)*d,hy+Math.sin(a)*d,1+r()*2.2,0,7);ctx.fill()}}
 // title
 const tx=W/2+10;
 telop('西洋美術史　第1話',tx,330,40,t,24.9,28.9,{align:'left',color:'226,170,120'});
 telop('最初の一筆',tx,470,140,t,25.4,28.9,{weight:800,per:0.16,align:'left',ls:0.12});
 telop('ラスコー、ショーヴェ、そして人類が描きはじめた理由',tx,620,32,t,26.5,28.9,{align:'left'});
 if(t>26.0){ctx.globalAlpha=clamp((t-26.0)/0.8)*(t>28.9?1-clamp((t-28.9)/0.6):1);ctx.fillStyle='rgba(226,170,120,0.9)';ctx.fillRect(tx,555,lerp(0,780,easeOut((t-26)/1.0)),2);ctx.globalAlpha=1}
 if(lt<0.5){ctx.fillStyle=`rgba(0,0,0,${1-lt/0.5})`;ctx.fillRect(0,0,W,H)}
}

window.ready=(async()=>{await document.fonts.load('500 40px Mincho');await document.fonts.load('800 40px Mincho');
 buildGrains();buildMottle();buildBison();buildWorld();return true})();
window.render=render;
</script></body></html>
